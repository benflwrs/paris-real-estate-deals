version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: paris-deals-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paris_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-paris_deals}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paris}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
